  <button id="fabPlus" aria-label="放大">＋</button>
  <button id="fabMinus" aria-label="縮小">－</button>

<div id="tip" class="tip">拖曳瀏覽 · 雙指縮放 · 上方可跳品牌</div>

<script>
(()=>{
const SVG_W=12080.0,SVG_H=5374.0;
const viewer=document.getElementById('viewer'),stage=document.getElementById('stage'),pct=document.getElementById('pct'),brandJump=document.getElementById('brandJump'),tip=document.getElementById('tip');
let z=1,pinchStartDistance=0,pinchStartZoom=1,pinchContentX=0,pinchContentY=0;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));

function applyZoom(next,anchorClientX=null,anchorClientY=null){
  const oldZ=z; next=clamp(next,.08,4);
  let contentX=null,contentY=null;
  if(anchorClientX!==null){
    const rect=viewer.getBoundingClientRect();
    const vx=anchorClientX-rect.left,vy=anchorClientY-rect.top;
    contentX=(viewer.scrollLeft+vx)/oldZ; contentY=(viewer.scrollTop+vy)/oldZ;
  }
  z=next;
  stage.style.transform='scale('+z+')';
  stage.style.width=(SVG_W*z)+'px';
  stage.style.height=(SVG_H*z)+'px';
  pct.textContent=Math.round(z*100)+'%';
  if(contentX!==null){
    const rect=viewer.getBoundingClientRect();
    viewer.scrollLeft=contentX*z-(anchorClientX-rect.left);
    viewer.scrollTop=contentY*z-(anchorClientY-rect.top);
  }
}

function fitWidth(){
  applyZoom(Math.max(.08,(viewer.clientWidth-12)/SVG_W));
  viewer.scrollLeft=0; viewer.scrollTop=0;
}
function zoomBy(mult){
  const r=viewer.getBoundingClientRect();
  applyZoom(z*mult,r.left+r.width/2,r.top+r.height/2);
}

document.getElementById('fitBtn').onclick=fitWidth;
document.getElementById('plusBtn').onclick=()=>zoomBy(1.25);
document.getElementById('minusBtn').onclick=()=>zoomBy(.8);
document.getElementById('fabPlus').onclick=()=>zoomBy(1.25);
document.getElementById('fabMinus').onclick=()=>zoomBy(.8);
document.getElementById('topBtn').onclick=()=>viewer.scrollTo({top:0,left:0,behavior:'smooth'});
brandJump.onchange=e=>{
  if(!e.target.value)return;
  viewer.scrollTo({top:Math.max(0,parseFloat(e.target.value)*z-15),behavior:'smooth'});
  e.target.selectedIndex=0;
};

// Drag-to-pan for mouse/pen, plus single-finger pan and two-finger pinch on touch.
let dragActive=false,dragPointerId=null,dragStartX=0,dragStartY=0,dragScrollLeft=0,dragScrollTop=0;
viewer.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||e.button!==0)return;
  dragActive=true;dragPointerId=e.pointerId;
  dragStartX=e.clientX;dragStartY=e.clientY;
  dragScrollLeft=viewer.scrollLeft;dragScrollTop=viewer.scrollTop;
  viewer.classList.add('dragging');
  try{viewer.setPointerCapture(e.pointerId)}catch(_){ }
  e.preventDefault();
});
viewer.addEventListener('pointermove',e=>{
  if(!dragActive||e.pointerId!==dragPointerId)return;
  viewer.scrollLeft=dragScrollLeft-(e.clientX-dragStartX);
  viewer.scrollTop=dragScrollTop-(e.clientY-dragStartY);
  e.preventDefault();
});
function endPointerDrag(e){
  if(!dragActive)return;
  if(e&&dragPointerId!==null&&e.pointerId!==dragPointerId)return;
  dragActive=false;dragPointerId=null;viewer.classList.remove('dragging');
}
viewer.addEventListener('pointerup',endPointerDrag);
viewer.addEventListener('pointercancel',endPointerDrag);
viewer.addEventListener('lostpointercapture',()=>{dragActive=false;dragPointerId=null;viewer.classList.remove('dragging')});

let touchDrag=false,touchStartX=0,touchStartY=0,touchScrollLeft=0,touchScrollTop=0;
viewer.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    const a=e.touches[0];
    touchDrag=true;touchStartX=a.clientX;touchStartY=a.clientY;
    touchScrollLeft=viewer.scrollLeft;touchScrollTop=viewer.scrollTop;
    viewer.classList.add('dragging');e.preventDefault();
  }else if(e.touches.length===2){
    touchDrag=false;viewer.classList.remove('dragging');e.preventDefault();
    const a=e.touches[0],b=e.touches[1],rect=viewer.getBoundingClientRect();
    pinchStartDistance=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
    pinchStartZoom=z;
    const midX=(a.clientX+b.clientX)/2,midY=(a.clientY+b.clientY)/2;
    pinchContentX=(viewer.scrollLeft+(midX-rect.left))/z;
    pinchContentY=(viewer.scrollTop+(midY-rect.top))/z;
  }
},{passive:false});
viewer.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&touchDrag){
    const a=e.touches[0];
    viewer.scrollLeft=touchScrollLeft-(a.clientX-touchStartX);
    viewer.scrollTop=touchScrollTop-(a.clientY-touchStartY);
    e.preventDefault();
  }else if(e.touches.length===2&&pinchStartDistance>0){
    touchDrag=false;viewer.classList.remove('dragging');e.preventDefault();
    const a=e.touches[0],b=e.touches[1],rect=viewer.getBoundingClientRect();
    const dist=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
    const midX=(a.clientX+b.clientX)/2,midY=(a.clientY+b.clientY)/2;
    z=clamp(pinchStartZoom*dist/pinchStartDistance,.08,4);
    stage.style.transform='scale('+z+')';
    stage.style.width=(SVG_W*z)+'px';stage.style.height=(SVG_H*z)+'px';
    pct.textContent=Math.round(z*100)+'%';
    viewer.scrollLeft=pinchContentX*z-(midX-rect.left);
    viewer.scrollTop=pinchContentY*z-(midY-rect.top);
  }
},{passive:false});
viewer.addEventListener('touchend',e=>{
  if(e.touches.length===0){touchDrag=false;viewer.classList.remove('dragging')}
  if(e.touches.length<2)pinchStartDistance=0;
},{passive:false});
viewer.addEventListener('touchcancel',()=>{touchDrag=false;pinchStartDistance=0;viewer.classList.remove('dragging')});

viewer.addEventListener('wheel',e=>{
  if(e.ctrlKey||e.metaKey){
    e.preventDefault();applyZoom(z*(e.deltaY<0?1.12:.89),e.clientX,e.clientY);
  }
},{passive:false});

requestAnimationFrame(()=>{
  fitWidth();
  if(matchMedia('(max-width:760px)').matches){
    setTimeout(()=>{tip.classList.add('show');setTimeout(()=>tip.classList.remove('show'),2600)},450);
  }
});
})();
</script>
