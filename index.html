<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="探索 AI 模型與版本的發展歷史。以品牌、年份與能力搜尋時間軸，查看發布日期、模型支線和原始來源。">
  <title>AI 模型族譜時間軸｜AI HISTORY</title>
  <link rel="stylesheet" href="assets/app.css?v=20261001-ux1">
  <script src="assets/data.js?v=20261001-ux1" defer></script>
  <script src="assets/explorer.js?v=20261001-ux1" defer></script>
</head>
<body>
<a class="skip-link" href="#content">跳至模型內容</a>
<header class="toolbar" id="toolbar">
  <nav class="nav" aria-label="主要導覽">
    <a class="logo" href="./" aria-label="AI HISTORY 模型史首頁"><span class="logo-mark" aria-hidden="true">◈</span> AI HISTORY</a>
    <div class="nav-links"><a href="./" aria-current="page">模型史</a><a href="./agents.html">Agents &amp; Tools <span aria-hidden="true">↗</span></a></div>
    <button id="updatesButton" class="updates-button" aria-haspopup="dialog">本次更新</button>
  </nav>
  <div class="workspace-heading"><div><h1>模型演進，一眼串起。</h1><p>跨品牌探索發布歷程，從每個節點回到原始來源。</p></div><span class="stamp" id="stamp">正在載入資料…</span></div>
  <div class="explore-bar">
    <div class="search-wrap"><span aria-hidden="true">⌕</span><label class="sr-only" for="search">搜尋模型、品牌或能力</label><input id="search" type="search" placeholder="搜尋模型、品牌或能力…" autocomplete="off"><kbd aria-hidden="true">/</kbd></div>
    <button id="filterToggle" class="filter-toggle" aria-expanded="false" aria-controls="filters">篩選 <span id="filterCount"></span></button>
    <div class="filters" id="filters">
      <label><span class="sr-only">品牌</span><select id="brandJump" aria-label="品牌"><option value="">所有品牌</option></select></label>
      <label><span class="sr-only">年份</span><select id="yearFilter" aria-label="年份"><option value="">所有年份</option></select></label>
      <label><span class="sr-only">模型能力</span><select id="typeFilter" aria-label="模型能力"><option value="">所有能力</option></select></label>
      <button id="resetFilters" class="text-button" hidden>清除篩選</button>
    </div>
  </div>
  <div class="view-bar"><p id="resultCount" role="status" aria-live="polite">載入中…</p><button id="updatesMobile" class="mobile-updates" aria-haspopup="dialog">更新</button><div class="view-switch" role="group" aria-label="檢視方式"><button id="timelineView" aria-pressed="true">時間軸</button><button id="listView" aria-pressed="false">閱讀列表</button></div></div>
</header>
<main id="content" tabindex="-1">
  <section class="viewer" id="viewer" tabindex="0" aria-label="互動模型時間軸" aria-describedby="gestureHelp">
    <div class="sizer" id="sizer"><div class="stage" id="stage"></div></div>
  </section>
  <div class="timeline-overlay" id="timelineOverlay"><p id="gestureHelp">拖曳移動 · Ctrl / ⌘ + 滾輪縮放 <span>· 方向鍵移動</span></p><div class="zoom-controls" role="group" aria-label="時間軸縮放"><button id="minusBtn" aria-label="縮小時間軸">−</button><button id="readBtn" title="回到 100% 閱讀大小"><span id="pct">100%</span></button><button id="plusBtn" aria-label="放大時間軸">＋</button><span class="divider"></span><button id="fitBtn">總覽</button><button id="latestBtn">最新 ↗</button></div></div>
  <section class="list-view" id="listResults" aria-label="模型閱讀列表" hidden></section>
  <div class="empty-state" id="emptyState" hidden><span aria-hidden="true">⌕</span><h2>沒有符合條件的模型</h2><p>試試其他關鍵字，或清除篩選再探索。</p><button id="emptyReset">清除全部條件</button></div>
  <div class="loading" id="loading" role="status"><span class="loading-dot" aria-hidden="true"></span><h2>正在整理模型時間軸</h2><p>載入歷史資料與更新紀錄…</p><button id="retryLoad" hidden>重新載入</button></div>
</main>
<dialog id="updatesPanel" class="updates-dialog" aria-labelledby="updatesTitle"><header class="dialog-heading"><div><span class="eyebrow">CHANGELOG</span><h2 id="updatesTitle">本次資料更新</h2></div><button id="closeUpdates" class="close" aria-label="關閉更新面板">×</button></header><p id="scope" class="muted"></p><div id="changeList"></div><p class="fineprint">「本次收錄」代表這批增量資料，並不等於剛發布。歷史底稿尚未逐筆重新查核。</p></dialog>
<dialog id="detail" aria-labelledby="detailTitle" aria-describedby="detailNote"><header class="dialog-heading"><span class="eyebrow" id="detailVendor"></span><button id="closeDetail" class="close" aria-label="關閉模型詳情">×</button></header><h2 id="detailTitle"></h2><p class="detail-meta" id="detailMeta"></p><div class="detail-tags" id="detailTags"></div><p id="detailNote"></p><p class="fineprint" id="detailProvenance"></p><h3 class="sources-heading">查看原始來源</h3><div class="sources" id="detailSources"></div><div class="detail-actions"><button id="locateDetail">在時間軸定位</button><button id="copyLink" class="secondary">複製節點連結</button></div><p id="copyStatus" class="fineprint" role="status"></p></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><div class="noscript">時間軸需要 JavaScript。請啟用 JavaScript，或閱讀 <a href="./agents.html">Agents &amp; Tools</a>。</div></noscript>
</body>
</html>
